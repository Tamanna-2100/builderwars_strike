<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#070a0d" id="theme-color-meta" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <title>Verity | Run review</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("verity-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = theme === "dark" ? "dark" : "light";
          var themeColor = document.getElementById("theme-color-meta");
          if (themeColor) themeColor.content = theme === "dark" ? "#070a0d" : "#f4fbfd";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
